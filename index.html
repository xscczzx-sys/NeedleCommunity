        /* Responsive */

            .header h1 {
                font-size: 2rem;

                grid-template-columns: 1fr;
            }

                grid-template-columns: repeat(2, 1fr);
            }
        }

            'leafeon': 470, 'wailmer': 320, 'lampent': 561, 'litwick': 607, 'sylveon': 700,
            'giratina': 487, 'charizard': 6, 'rayquaza': 384, 'ceruledge': 911, 'squirtle': 7,
            'wartortle': 8, 'blastoise': 9, 'mantine': 226, 'dewgong': 87, 'psyduck': 54,
            'munchlax': 446, 'lapras': 131, 'mew': 151, 'riolu': 406, 'lucario': 445,
            'lycanroc': 745, 'togepi': 175, 'igglybuff': 174, 'diancie': 719, 'reuniclus': 579,
            'wigglytuff': 40, 'herdier': 507, 'lillipup': 506, 'toedscool': 285, 'sudowoodo': 185,
            'pyukumuku': 771
        };

        // Fetch using Google Visualization API
        async function fetchSheetData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
                const response = await fetch(url);
                const text = await response.text();
                
                // Remove the Google JSON wrapper
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const json = JSON.parse(jsonStr);
                
                parseGoogleData(json);
                renderCards(data);
                setupImageFallbacks();
                console.log('Data loaded successfully:', data.length, 'members');
            } catch (error) {
                console.error('Error fetching sheet:', error);
                document.getElementById('grid').innerHTML = `
                    <div class="empty-state">
                        <h2>Error Loading Data</h2>
                        <p>Could not fetch data from Google Sheet. Make sure it's shared publicly.</p>
                    </div>
                `;
            }
        }

        // Parse data from Google Visualization API
        function parseGoogleData(json) {
            data = [];
            
            if (!json.table || !json.table.rows) {
                console.error('Invalid sheet format');
                return;
            }
            
            // Skip the first row (header) and process rest
            json.table.rows.forEach((row, index) => {
                // Skip header row (usually first row, but also skip rows that look like headers)
                if (index === 0) return;
                
                const name = row.c[0]?.v || '';
                const pokemon = row.c[1]?.v || '';
                const artists = row.c[2]?.v || '';
                
                // Skip if name is empty or looks like a header
                if (name && name.toLowerCase() !== 'who are u') {
                    data.push({
                        name: name,
                        pokemon: pokemon,
                        artists: artists
                    });
                }
            });
        }

        function getPokemonImageUrl(name, memberName = '') {
            const pokemonName = name.toLowerCase()
                .replace(/\s+/g, '-')           // spaces to dashes
                .replace(/♀/g, '-f')            // female symbol
                .replace(/♂/g, '-m')            // male symbol
                .replace(/[:'?!*&^%$#@()[\]{}<>|\\~`]/g, '')  // remove special chars
                .replace(/-+/g, '-')            // clean up multiple dashes
                .replace(/^-|-$/g, '')          // remove leading/trailing dashes
                .split('-')[0];                 // get only first word (before any dash)
            
            // Special forms for German's card
            if (memberName === 'German') {
                if (pokemonName === 'charizard') {
                    return `https://img.pokemondb.net/sprites/bank/normal/charizard-mega-x.png`;
                }
                if (pokemonName === 'rayquaza') {
                    return `https://img.pokemondb.net/sprites/home/shiny/rayquaza-mega.png`;
                }
                if (pokemonName === 'giratina') {
                    return `https://img.pokemondb.net/sprites/home/normal/giratina-origin.png`;
                }
            }
            
            // Use normal sprites for everyone else
            return `https://img.pokemondb.net/sprites/sword-shield/normal/${pokemonName}.png`;
        }

        // Image fallback handler with extended version support
        function setupImageFallbacks() {
            const versions = [
                'home',                     // Home - widest coverage, try first!
                'sword-shield',             // Gen 8
                'ultra-sun-ultra-moon',     // Gen 7
                'sun-moon',                 // Gen 7
                'X-Y',                      // Gen 6
                'omega-ruby-alpha-sapphire', // Gen 6 remakes
                'black-2-white-2',          // Gen 5
                'black-white',              // Gen 5 - has Blitzle
                'diamond-pearl',            // Gen 4
                'platinum',                 // Gen 4
                'heartgold-soulsilver',     // Gen 4 remakes - has Mankey, Raticate
                'emerald',                  // Gen 3
                'ruby-sapphire',            // Gen 3
                'firered-leafgreen',        // Gen 3 remakes - has Gen 1
                'crystal',                  // Gen 2 - has Mankey, Raticate
                'gold-silver',              // Gen 2
                'yellow',                   // Gen 1 - has all Gen 1
                'blue',                     // Gen 1 - has all Gen 1
                'red',                      // Gen 1 - has all Gen 1
                'scarlet-violet',           // Gen 9
                'legends-arceus',           // Legends
                'brilliant-diamond-shining-pearl' // Gen 4 remakes
            ];
            
            document.querySelectorAll('.pokemon-img img').forEach(img => {
                let attemptCount = 0;
                
                img.addEventListener('error', function() {
                    const currentSrc = this.src;
                    let pokemonName = currentSrc.split('/').pop().replace('.png', '');
                    
                    // Extract base pokemon name (remove -mega, -origin, etc)
                    const baseName = pokemonName.split('-').slice(0, 1).join('-');
                    
                    // If it's a special form that failed, try normal version first
                    if (pokemonName.includes('mega') || pokemonName.includes('origin') || pokemonName.includes('shiny')) {
                        this.src = `https://img.pokemondb.net/sprites/sword-shield/normal/${baseName}.png`;
                        attemptCount = 0;
                        return;
                    }
                    
                    // Try next version in the list
                    if (attemptCount < versions.length) {
                        const nextVersion = versions[attemptCount];
                        this.src = `https://img.pokemondb.net/sprites/${nextVersion}/normal/${baseName}.png`;
                        attemptCount++;
                    } else {
                        // All versions failed, try PokeAPI
                        const pokemonId = pokemonIds[baseName] || 25;
                        this.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonId}.png`;
                    }
                });
            });
        }

        function renderCards(members) {
            const grid = document.getElementById('grid');
            
            if (members.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No Results Found</h2>
                        <p>Try searching with different terms</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = members.map(member => {
                const pokemon = member.pokemon
                    .split(',')
                    .map(p => p.trim())
                    .filter(p => p)
                    .slice(0, 6);
                
                const artists = member.artists
                    .split(',')
                    .map(a => a.trim())
                    .filter(a => a)
                    .slice(0, 4);

                return `
                    <div class="card">
                        <div class="card-content">
                            ${pokemon.length > 0 ? `
                                <div class="pokemon-images">
                                    ${pokemon.slice(0, 3).map(p => `
                                        <div class="pokemon-img" title="${p}">
                                            <img src="${getPokemonImageUrl(p, member.name)}" alt="${p}" class="sprite" onerror="this.parentElement.style.display='none';">
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            <div class="member-name ${member.name === 'German' ? 'creator-name' : ''}">${member.name}</div>
                            
                            ${pokemon.length > 0 ? `
                                <div class="section">
                                    <div class="section-title">Favorite Pokémon</div>
                                    <div class="badges">
                                        ${pokemon.map(p => `<span class="badge" style="color: ${getPokemonBadgeColor(p)}; font-weight: 600;">${p}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}
                            
                            ${artists.length > 0 ? `
                                <div class="section">
                                    <div class="section-title">Favorite Artists</div>
                                    <div class="badges">
                                        ${artists.map(a => `<span class="badge artist">${a}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fetch data on page load
        fetchSheetData();

        // Auto-refresh every 30 seconds
        setInterval(fetchSheetData, 30000);

        // Search functionality

        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C (Inspect Element)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
        });
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            const filtered = data.filter(member => {
                const nameMatch = member.name.toLowerCase().includes(query);
                const pokemonMatch = member.pokemon.toLowerCase().includes(query);
                const artistMatch = member.artists.toLowerCase().includes(query);
                return nameMatch || pokemonMatch || artistMatch;
            });

            renderCards(filtered);
            setupImageFallbacks();
        });
    </script>
</body>
</html>
