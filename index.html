<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Needle Community Pokémon Favorites</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── THEMES ── */
        body.theme-light {
            --bg: #faf5ff;
            --bg2: rgba(220,180,255,0.3);

            --text-muted: #7c5aa0;
            --border: rgba(124,58,237,0.2);
            --search-bg: rgba(220,180,255,0.5);
            --badge-bg: rgba(255,255,255,0.7);
            --react-bg: rgba(255,255,255,0.6);
            --section-title: #9333ea;
            --divider: rgba(124,58,237,0.15);
        }
        body.theme-medium {
            --bg: #e9d8fd;
            --bg2: rgba(180,130,255,0.25);
            --card-bg: rgba(210,170,255,0.7);
            --card-hover: rgba(190,140,255,0.85);

            --text-muted: #6b3fa0;
            --border: rgba(124,58,237,0.3);
            --search-bg: rgba(190,140,255,0.4);
            --badge-bg: rgba(255,255,255,0.6);
            --react-bg: rgba(255,255,255,0.5);
            --section-title: #7c3aed;
            --divider: rgba(124,58,237,0.2);
        }
        body.theme-dark {
            --bg: #2a1f40;
            --bg2: rgba(60,30,100,0.4);
            --card-bg: rgba(50,30,80,0.8);
            --card-hover: rgba(70,40,110,0.9);
            --text: #e9d5ff;
            --text-muted: #c4b5fd;
            --border: rgba(168,85,247,0.3);
            --search-bg: rgba(60,30,100,0.6);
            --badge-bg: rgba(80,40,120,0.6);
            --react-bg: rgba(80,40,120,0.5);
            --section-title: #c084fc;
            --divider: rgba(168,85,247,0.2);
        }
        body.theme-darker {
            --bg: #0f0a1a;
            --bg2: rgba(30,10,60,0.5);
            --card-bg: rgba(25,10,50,0.9);
            --card-hover: rgba(40,15,80,0.95);
            --text: #f3e8ff;
            --text-muted: #d8b4fe;
            --border: rgba(168,85,247,0.25);
            --search-bg: rgba(30,10,60,0.7);
            --badge-bg: rgba(50,20,90,0.7);
            --react-bg: rgba(50,20,90,0.6);
            --section-title: #e879f9;
            --divider: rgba(168,85,247,0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.4s, color 0.4s;
        }

        /* ── THEME SWITCHER ── */
        .theme-switcher {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.4rem;
            z-index: 999;
            background: var(--card-bg);
            padding: 0.4rem;
            border-radius: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        .theme-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover, .theme-btn.active { border-color: #7c3aed; transform: scale(1.2); }
        .theme-btn.t-light  { background: #faf5ff; box-shadow: 0 0 0 1px #ccc; }
        .theme-btn.t-medium { background: #e9d8fd; box-shadow: 0 0 0 1px #b48fe8; }
        .theme-btn.t-dark   { background: #2a1f40; box-shadow: 0 0 0 1px #7c3aed; }
        .theme-btn.t-darker { background: #0f0a1a; box-shadow: 0 0 0 1px #6d28d9; }

        /* ── HEADER ── */
        .header { text-align: center; padding: 3rem 1rem 1.5rem; }
        .header h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
        .header h1 .poke { 
            background: linear-gradient(90deg, #7c3aed, #a855f7, #7c3aed);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: gradientFlow 3s linear infinite;
        }
        .header h1 .needle { color: var(--text); font-weight: 300; }
        @keyframes gradientFlow { to { background-position: 200% center; } }
        .header-line { width: 60px; height: 2px; background: linear-gradient(90deg,#7c3aed,#a855f7); margin: 1rem auto; border-radius: 2px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }

        /* ── SEARCH ── */
        .search-wrap { max-width: 500px; margin: 1.5rem auto 2rem; padding: 0 1rem; }
        .search-box { position: relative; }
        .search-box svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
            width: 100%; padding: 0.9rem 1rem 0.9rem 3rem;
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
            background: var(--search-bg); color: var(--text);
            border: 1.5px solid var(--border); border-radius: 50px;
            outline: none; transition: all 0.3s;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: #7c3aed; }

        /* ── GRID ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 1.2rem; padding: 0 1.5rem 4rem; max-width: 1400px; margin: 0 auto; }

        /* ── CARD ── */
        .card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }
        .card:hover { background: var(--card-hover); border-color: #7c3aed; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(124,58,237,0.15); }
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Creator card */
        .creator-card {
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 12px rgba(14,165,233,0.4), 0 0 24px rgba(14,165,233,0.2);
            animation: creatorGlow 3s ease-in-out infinite;
        }
        @keyframes creatorGlow {
            0%,100% { box-shadow: 0 0 12px rgba(14,165,233,0.4), 0 0 24px rgba(14,165,233,0.2); }
            50%      { box-shadow: 0 0 18px rgba(14,165,233,0.7), 0 0 36px rgba(14,165,233,0.35); }
        }

        /* ── POKEMON IMAGES ── */
        .pokemon-images {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            margin-bottom: 1rem; padding: 0.7rem;
            background: var(--bg2); border-radius: 12px;
            border: 1px solid var(--border);
        }
        .pokemon-img {
            flex: 1; min-width: 55px; aspect-ratio: 1;
            background: var(--badge-bg); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); overflow: hidden;
            transition: all 0.3s;
        }
        .pokemon-img:hover { border-color: #7c3aed; }
        .pokemon-img img { width: 80%; height: 80%; object-fit: contain; }

        /* ── MEMBER NAME ── */
        .member-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.7rem; color: #c2185b; }
        .creator-name {
            color: #0ea5e9 !important;
            text-shadow: 0 0 8px rgba(14,165,233,0.6);
            animation: creatorNameGlow 2s ease-in-out infinite;
        }
        @keyframes creatorNameGlow {
            0%,100% { text-shadow: 0 0 8px rgba(14,165,233,0.6); }
            50%      { text-shadow: 0 0 14px rgba(14,165,233,0.9), 0 0 24px rgba(14,165,233,0.4); }
        }

        /* ── SECTIONS ── */
        .section { margin-bottom: 0.8rem; }
        .section-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; color: var(--section-title); margin-bottom: 0.5rem; text-transform: uppercase; }
        .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .badge {
            padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.78rem;
            background: var(--badge-bg); border: 1px solid var(--border); color: var(--text);
        }
        .badge.artist { color: var(--text-muted); }

        /* ── REACTIONS ── */
        .reaction-bar { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--divider); }
        .react-btn {
            display: flex; align-items: center; gap: 0.3rem;
            padding: 0.28rem 0.65rem; border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--react-bg); cursor: pointer;
            font-size: 0.82rem; font-weight: 600; color: var(--text);
            transition: all 0.2s; user-select: none; font-family: 'Inter', sans-serif;
        }
        .react-btn:hover { border-color: #7c3aed; transform: scale(1.08); }
        .react-btn.reacted { background: rgba(124,58,237,0.2); border-color: #7c3aed; }
        .react-btn .emoji { font-size: 0.95rem; }
        .react-btn .count { font-size: 0.78rem; min-width: 10px; }

        /* ── FOOTER ── */
        .footer { text-align: center; padding: 2rem 1rem; margin-top: 2rem; font-size: 0.8rem; color: rgba(125,107,176,0.3); letter-spacing: 1px; border-top: 1px solid transparent; }
        .footer span { color: #0ea5e9; font-weight: 600; text-shadow: 0 0 8px rgba(14,165,233,0.5); animation: creatorNameGlow 2s ease-in-out infinite; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .grid { grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); padding: 0 1rem 4rem; }
            .theme-switcher { top: 0.6rem; right: 0.6rem; }
        }
    </style>
</head>

    // ── POKEMON IMAGE - Dynamic lookup, handles shiny automatically ──
    const imageCache = {};

    function getPokemonImageUrl(name, memberName = '') {
        // Detect shiny keyword
        const isShiny = /shiny/i.test(name);

        const clean = name.toLowerCase()
            .replace(/shiny/gi, '')           // remove "shiny" word
            .replace(/\s+/g, '-')
            .replace(/♀/g, '-f').replace(/♂/g, '-m')
            .replace(/[:'?!*&^%$#@()[\]{}<>|\\~`]/g, '')
            .replace(/-+/g, '-').replace(/^-|-$/g, '')
            .split('-')[0];

        // Check manual ID map first (instant)
        const id = pokemonIds[clean];
        if (id) {
            if (isShiny) {
                return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/${id}.png`;
            }
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
        }

        // Unknown — dynamic loader will handle it
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/0.png`;
    }

    // Dynamically fetch unknown Pokemon from PokeAPI by name
    async function loadUnknownPokemonImages() {
        const imgs = document.querySelectorAll('.pokemon-img img');
        const promises = [];

        imgs.forEach(img => {
            if (img.src.includes('/0.png') || img.dataset.loaded === 'false') {
                const rawName = img.alt; // original name from sheet
                const isShiny = /shiny/i.test(rawName);

                const pokemonName = rawName.toLowerCase()
                    .replace(/shiny/gi, '')
                    .replace(/\s+/g, '-')
                    .replace(/[:'?!*&^%$#@()[\]{}<>|\\~`]/g, '')
                    .replace(/-+/g, '-').replace(/^-|-$/g, '')
                    .split('-')[0];

                const cacheKey = (isShiny ? 'shiny_' : '') + pokemonName;

                if (!pokemonName || imageCache[cacheKey] === 'missing') {
                    img.parentElement.style.display = 'none';
                    return;
                }

                if (imageCache[cacheKey]) {
                    img.src = imageCache[cacheKey];
                    return;
                }

                const p = fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`)
                    .then(r => r.json())
                    .then(data => {
                        let url;
                        if (isShiny) {
                            url = data.sprites?.other?.['official-artwork']?.front_shiny
                                || data.sprites?.front_shiny
                                || data.sprites?.other?.['official-artwork']?.front_default;
                        } else {
                            url = data.sprites?.other?.['official-artwork']?.front_default
                                || data.sprites?.front_default;
                        }

                        if (url) {
                            imageCache[cacheKey] = url;
                            img.src = url;
                        } else {
                            imageCache[cacheKey] = 'missing';
                            img.parentElement.style.display = 'none';
                        }
                    })
                    .catch(() => {
                        imageCache[cacheKey] = 'missing';
                        img.parentElement.style.display = 'none';
                    });
                promises.push(p);
            }
        });

        await Promise.all(promises);
    }

    // SETUP: Go to https://console.firebase.google.com
    // 1. Create project "pokeneedle"
    // 2. Build > Realtime Database > Create > Start in test mode
    // 3. Copy your DB URL and replace the one below
    const FB_URL = 'https://pokeneedle-e3307-default-rtdb.asia-southeast1.firebasedatabase.app/reactions';

    async function loadReactions() {
        try {
            const res = await fetch(`${FB_URL}.json`);
            const data = await res.json();
            reactions = data || {};
        } catch(e) { reactions = {}; }
    }

    async function saveReaction(memberName) {
        try {
            await fetch(`${FB_URL}/${encodeURIComponent(memberName)}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reactions[memberName])
            });
        } catch(e) {}
    }

    async function toggleReact(memberName, type) {
        const slug = memberName.replace(/\s+/g,'-');
        const myKey = 'pokeneedle_my_' + memberName + '_' + type;
        const already = localStorage.getItem(myKey);

        if (!reactions[memberName]) reactions[memberName] = { heart: 0, wow: 0 };

        if (already) {
            reactions[memberName][type] = Math.max(0, (reactions[memberName][type] || 0) - 1);
            localStorage.removeItem(myKey);
        } else {
            reactions[memberName][type] = (reactions[memberName][type] || 0) + 1;
            localStorage.setItem(myKey, '1');
        }

        updateReactUI(memberName, slug);
        await saveReaction(memberName);
    }

    function updateReactUI(memberName, slug) {
        const counts = reactions[memberName] || { heart: 0, wow: 0 };
        ['heart','wow'].forEach(type => {
            const btn   = document.getElementById(`react-${type}-${slug}`);
            const count = document.getElementById(`count-${type}-${slug}`);
            if (!btn || !count) return;
            count.textContent = counts[type] || 0;
            const myKey = 'my_' + memberName + '_' + type;
            btn.classList.toggle('reacted', !!localStorage.getItem(myKey));
        });
    }

    function loadAllReactUI() {
        data.forEach(m => updateReactUI(m.name, m.name.replace(/\s+/g,'-')));

            loadAllReactUI();
        } catch(e) {
            document.getElementById('grid').innerHTML = `<div style="text-align:center;padding:3rem;grid-column:1/-1;color:var(--text-muted);">Error loading data. Please refresh.</div>`;
        }
    }

    function parseGoogleData(json) {
        data = [];
        if (!json.table?.rows) return;
        json.table.rows.forEach((row, i) => {
            if (i === 0) return;
            const name = row.c[0]?.v || '';
            const pokemon = row.c[1]?.v || '';
            const artists = row.c[2]?.v || '';
            if (name && name.toLowerCase() !== 'who are u') data.push({ name, pokemon, artists });
        });
    }

    function renderCards(members) {
        const grid = document.getElementById('grid');
        if (!members.length) {
            grid.innerHTML = `<div style="text-align:center;padding:3rem;grid-column:1/-1;color:var(--text-muted);">No results found.</div>`;
            return;
        }
        grid.innerHTML = members.map(m => {
            const pokemon = m.pokemon.split(',').map(p=>p.trim()).filter(p=>p).slice(0,6);
            const artists = m.artists.split(',').map(a=>a.trim()).filter(a=>a).slice(0,4);
            const isCreator = m.name === 'German';
            const slug = m.name.replace(/\s+/g,'-');
            return `
            <div class="card ${isCreator ? 'creator-card' : ''}">
                <div class="card-body">
                ${pokemon.length ? `
                <div class="pokemon-images">
                    ${pokemon.slice(0,3).map(p=>`
                    <div class="pokemon-img" title="${p}">
                        <img src="${getPokemonImageUrl(p, m.name)}" alt="${p}" onerror="this.dataset.loaded='false';this.src='';loadUnknownPokemonImages()">
                    </div>`).join('')}
                </div>` : ''}
                <div class="member-name ${isCreator ? 'creator-name' : ''}">${m.name}</div>
                ${pokemon.length ? `
                <div class="section">
                    <div class="section-title">Favorite Pokémon</div>
                    <div class="badges">
                        ${pokemon.map(p=>`<span class="badge" style="color:${getPokemonBadgeColor(p)};font-weight:600">${p}</span>`).join('')}
                    </div>
                </div>` : ''}
                ${artists.length ? `
                <div class="section">
                    <div class="section-title">Favorite Artists</div>
                    <div class="badges">
                        ${artists.map(a=>`<span class="badge artist">${a}</span>`).join('')}
                    </div>
                </div>` : ''}
                </div>
                <div class="reaction-bar">
                    <button class="react-btn" id="react-heart-${slug}" onclick="toggleReact('${m.name}','heart')">
                        <span class="emoji">❤️</span><span class="count" id="count-heart-${slug}">0</span>
                    </button>
                    <button class="react-btn" id="react-wow-${slug}" onclick="toggleReact('${m.name}','wow')">
                        <span class="emoji">🤩</span><span class="count" id="count-wow-${slug}">0</span>
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    // ── SEARCH ───────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        const filtered = data.filter(m =>
            m.name.toLowerCase().includes(q) ||
            m.pokemon.toLowerCase().includes(q) ||
            m.artists.toLowerCase().includes(q)
        );
        renderCards(filtered);
        loadUnknownPokemonImages();
        loadAllReactUI();
    });

    // ── INIT ─────────────────────────────────────────────────────────
    fetchSheetData();
    setInterval(fetchSheetData, 30000);

    // ── DISABLE RIGHT CLICK & DEV TOOLS ──────────────────────────────
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key))) e.preventDefault();
    });
</script>
</body>
</html>
