<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needle Community Pokémon Favorites</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── THEMES ── */
        body.theme-light {
            --bg: #faf5ff; --bg2: rgba(220,180,255,0.3); --card-bg: rgba(240,220,255,0.8);
            --card-hover: rgba(220,180,255,0.9); --text: #3d2363; --text-muted: #7c5aa0;
            --border: rgba(124,58,237,0.2); --search-bg: rgba(220,180,255,0.5);
            --badge-bg: rgba(255,255,255,0.7); --react-bg: rgba(255,255,255,0.6);
            --section-title: #9333ea; --divider: rgba(124,58,237,0.15);
        }
        body.theme-medium {
            --bg: #e9d8fd; --bg2: rgba(180,130,255,0.25); --card-bg: rgba(210,170,255,0.7);
            --card-hover: rgba(190,140,255,0.85); --text: #2d1b4e; --text-muted: #6b3fa0;
            --border: rgba(124,58,237,0.3); --search-bg: rgba(190,140,255,0.4);
            --badge-bg: rgba(255,255,255,0.6); --react-bg: rgba(255,255,255,0.5);
            --section-title: #7c3aed; --divider: rgba(124,58,237,0.2);
        }
        body.theme-dark {
            --bg: #2a1f40; --bg2: rgba(60,30,100,0.4); --card-bg: rgba(50,30,80,0.8);
            --card-hover: rgba(70,40,110,0.9); --text: #e9d5ff; --text-muted: #c4b5fd;
            --border: rgba(168,85,247,0.3); --search-bg: rgba(60,30,100,0.6);
            --badge-bg: rgba(80,40,120,0.6); --react-bg: rgba(80,40,120,0.5);
            --section-title: #c084fc; --divider: rgba(168,85,247,0.2);
        }
        body.theme-darker {
            --bg: #0f0a1a; --bg2: rgba(30,10,60,0.5); --card-bg: rgba(25,10,50,0.9);
            --card-hover: rgba(40,15,80,0.95); --text: #f3e8ff; --text-muted: #d8b4fe;
            --border: rgba(168,85,247,0.25); --search-bg: rgba(30,10,60,0.7);
            --badge-bg: rgba(50,20,90,0.7); --react-bg: rgba(50,20,90,0.6);
            --section-title: #e879f9; --divider: rgba(168,85,247,0.15);
        }
        body.theme-neon {
            --bg: #020010; --bg2: rgba(0,255,200,0.05); --card-bg: rgba(0,0,30,0.95);
            --card-hover: rgba(0,20,50,0.98); --text: #00ffcc; --text-muted: #ff00ff;
            --border: rgba(0,255,200,0.3); --search-bg: rgba(0,255,200,0.07);
            --badge-bg: rgba(0,255,200,0.08); --react-bg: rgba(0,255,200,0.06);
            --section-title: #ff00ff; --divider: rgba(0,255,200,0.2);
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.4s, color 0.4s; }

        /* ── THEME SWITCHER ── */
        .theme-switcher { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.4rem; z-index: 999; background: var(--card-bg); padding: 0.4rem; border-radius: 30px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .theme-btn { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .theme-btn:hover, .theme-btn.active { border-color: #7c3aed; transform: scale(1.2); }
        .theme-btn.t-light  { background: #faf5ff; box-shadow: 0 0 0 1px #ccc; }
        .theme-btn.t-medium { background: #e9d8fd; box-shadow: 0 0 0 1px #b48fe8; }
        .theme-btn.t-dark   { background: #2a1f40; box-shadow: 0 0 0 1px #7c3aed; }
        .theme-btn.t-darker { background: #0f0a1a; box-shadow: 0 0 0 1px #6d28d9; }
        .theme-btn.t-neon   { background: #020010; box-shadow: 0 0 6px #00ffcc, 0 0 0 1px #00ffcc; }

        /* Neon theme special effects */
        body.theme-neon .card {
            box-shadow: 0 0 8px rgba(0,255,200,0.15);
        }
        body.theme-neon .card:hover {
            box-shadow: 0 0 20px rgba(0,255,200,0.4), 0 0 40px rgba(0,255,200,0.1) !important;
            border-color: #00ffcc !important;
        }
        body.theme-neon .member-name {
            color: #00ffcc !important;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px rgba(0,255,200,0.5);
        }
        body.theme-neon .badge {
            border-color: rgba(0,255,200,0.25);
            text-shadow: 0 0 6px currentColor;
        }
        body.theme-neon .section-title { text-shadow: 0 0 8px #ff00ff; }
        body.theme-neon .header h1 .needle { color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
        body.theme-neon .header-line { background: linear-gradient(90deg,#00ffcc,#ff00ff); box-shadow: 0 0 10px #00ffcc; }
        body.theme-neon .subtitle { color: #ff00ff; text-shadow: 0 0 8px #ff00ff; }
        body.theme-neon .react-btn:hover { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,200,0.4); }
        body.theme-neon .react-btn.reacted { border-color: #00ffcc; background: rgba(0,255,200,0.1); box-shadow: 0 0 8px rgba(0,255,200,0.3); }
        body.theme-neon .search-box input:focus { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,200,0.3); }
        body.theme-neon .card-silhouette { filter: grayscale(100%) brightness(10) sepia(1) hue-rotate(120deg); opacity: 0.04; }

        /* ── HEADER ── */
        .header { text-align: center; padding: 3rem 1rem 1.5rem; }
        .header h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
        .header h1 .poke { background: linear-gradient(90deg,#7c3aed,#a855f7,#7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: gradientFlow 3s linear infinite; }
        .header h1 .needle { color: var(--text); font-weight: 300; }
        @keyframes gradientFlow { to { background-position: 200% center; } }
        .header-line { width: 60px; height: 2px; background: linear-gradient(90deg,#7c3aed,#a855f7); margin: 1rem auto; border-radius: 2px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }

        /* ── BROWSER TABS ── */
        .browser-tabs {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 1.5rem;
            max-width: 1400px;
            margin: 1.5rem auto 0;
            gap: 0;
            position: relative;
        }
        .browser-tabs::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border);
        }
        .browser-tab {
            position: relative;
            padding: 0.6rem 1.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: 1.5px solid transparent;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
            z-index: 1;
            white-space: nowrap;
            margin-bottom: -2px;
        }
        .browser-tab:hover { color: var(--text); background: var(--bg2); }
        .browser-tab.active {
            background: var(--card-bg);
            color: var(--text);
            border-color: var(--border);
            border-bottom-color: var(--card-bg);
            z-index: 2;
        }
        body.theme-neon .browser-tab.active {
            border-color: rgba(0,255,200,0.3);
            border-bottom-color: var(--card-bg);
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
        }

        /* ── SCROLL TO TOP ── */
        .scroll-top {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(124,58,237,0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 998;
            font-size: 1.1rem;
        }
        .scroll-top.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .scroll-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(124,58,237,0.5);
        }
        body.theme-neon .scroll-top {
            background: linear-gradient(135deg, #00ffcc, #00ccaa);
            box-shadow: 0 4px 15px rgba(0,255,200,0.4);
        }
        .mods-view {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }
        .mods-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .mods-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }
        .mods-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
        }
        .mod-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 1rem 0.8rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .mod-card:hover {
            transform: translateY(-3px);
            border-color: #7c3aed;
            box-shadow: 0 8px 20px rgba(124,58,237,0.15);
        }
        .mod-pokemon-img {
            width: 65px;
            height: 65px;
            margin: 0 auto 0.5rem;
        }
        .mod-pokemon-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(124,58,237,0.2));
        }
        .mod-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #c2185b;
            margin-bottom: 0.4rem;
        }
        .mod-fav-pokemon {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        .mod-pokemon-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.25rem;
            margin-top: 0.4rem;
        }
        .mod-pokemon-badge {
            font-size: 0.62rem;
            padding: 0.15rem 0.4rem;
            border-radius: 20px;
            background: var(--badge-bg);
            border: 1px solid var(--border);
            font-weight: 600;
        }
        .mod-silhouette {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 90px;
            height: 90px;
            opacity: 0.05;
            filter: grayscale(100%) brightness(0);
            pointer-events: none;
        }
        body.theme-dark .mod-silhouette,
        body.theme-darker .mod-silhouette { filter: grayscale(100%) brightness(10); }

        /* ── BIRTHDAY LIST ── */
        .birthday-list { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
        .birthday-month-section { margin-bottom: 2rem; }
        .birthday-month-title {
            font-size: 0.85rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; padding: 0.6rem 1rem; margin-bottom: 0.8rem;
            border-radius: 10px; display: flex; align-items: center; gap: 0.5rem;
            color: #3d2363;
        }
        .birthday-entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 0.6rem; }
        .birthday-entry {
            background: var(--card-bg); border: 1.5px solid var(--border);
            border-radius: 12px; padding: 0.7rem 1rem;
            display: flex; align-items: center; gap: 0.8rem; transition: all 0.2s;
        }
        .birthday-entry:hover { transform: translateY(-2px); }
        .birthday-entry.today { box-shadow: 0 0 12px rgba(168,85,247,0.3); }
        .birthday-entry .day-badge {
            min-width: 36px; height: 24px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; color: #3d2363;
            flex-shrink: 0; padding: 0 0.5rem;
        }
        .birthday-entry .entry-name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
        .birthday-entry .entry-pokemon { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; font-style: italic; }
        .search-wrap { max-width: 500px; margin: 1.5rem auto 2rem; padding: 0 1rem; }
        .search-box { position: relative; }
        .search-box svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; padding: 0.9rem 1rem 0.9rem 3rem; font-size: 0.95rem; font-family: 'Inter', sans-serif; background: var(--search-bg); color: var(--text); border: 1.5px solid var(--border); border-radius: 50px; outline: none; transition: all 0.3s; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: #7c3aed; }

        /* ── GRID ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 1.2rem; padding: 0 1.5rem 4rem; max-width: 1400px; margin: 0 auto; }

        /* ── CARD ── */
        .card { cursor: pointer; position: relative; overflow: hidden; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 16px; padding: 1.2rem; transition: all 0.3s; backdrop-filter: blur(10px); display: flex; flex-direction: column; }
        .card:hover { background: var(--card-hover); border-color: #7c3aed; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(124,58,237,0.15); }
        .card.active { border-color: #7c3aed !important; box-shadow: 0 0 0 3px rgba(124,58,237,0.15), 0 12px 32px rgba(124,58,237,0.2) !important; }

        /* ── SILHOUETTE ── */
        .card-silhouette { position: absolute; bottom: -10px; right: -10px; width: 160px; height: 160px; opacity: 0.06; filter: grayscale(100%) brightness(0); pointer-events: none; z-index: 0; transition: opacity 0.3s; }
        body.theme-dark .card-silhouette, body.theme-darker .card-silhouette { filter: grayscale(100%) brightness(10); opacity: 0.05; }
        .card:hover .card-silhouette { opacity: 0.1; }
        .card-body { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }
        .reaction-bar { position: relative; z-index: 1; }

        /* ── CREATOR CARD ── */
        .creator-card { border-color: #0ea5e9 !important; box-shadow: 0 0 12px rgba(14,165,233,0.4), 0 0 24px rgba(14,165,233,0.2); animation: creatorGlow 3s ease-in-out infinite; }
        @keyframes creatorGlow { 0%,100% { box-shadow: 0 0 12px rgba(14,165,233,0.4), 0 0 24px rgba(14,165,233,0.2); } 50% { box-shadow: 0 0 18px rgba(14,165,233,0.7), 0 0 36px rgba(14,165,233,0.35); } }
        body.theme-light .creator-card, body.theme-medium .creator-card { border-color: #1e3a5f !important; animation: creatorGlowLight 3s ease-in-out infinite; }
        @keyframes creatorGlowLight { 0%,100% { box-shadow: 0 0 12px rgba(30,58,95,0.5), 0 0 24px rgba(30,58,95,0.3); } 50% { box-shadow: 0 0 20px rgba(30,58,95,0.8), 0 0 36px rgba(30,58,95,0.5); } }

        /* ── POKEMON IMAGES ── */
        .pokemon-images { position: relative; overflow: hidden; margin-bottom: 1rem; background: var(--bg2); border-radius: 12px; border: 1px solid var(--border); height: 100px; }
        .pokemon-images.single { display: flex; align-items: center; justify-content: center; padding: 0.5rem; height: 160px; }
        .pokemon-images.single .pokemon-img { width: 140px; height: 140px; background: transparent; border: none; }
        .pokemon-images.single .pokemon-img img { width: 100%; height: 100%; }
        .pokemon-images.auto-single { display: flex; align-items: center; justify-content: center; padding: 0.5rem; height: 160px; }
        .pokemon-images.auto-single .pokemon-img { width: 140px; height: 140px; background: transparent; border: none; }
        .pokemon-images.auto-single .pokemon-img img { width: 100%; height: 100%; }
        .pokemon-track { display: flex; gap: 0.5rem; padding: 0.7rem; will-change: transform; }
        .pokemon-img { min-width: 85px; width: 85px; height: 85px; flex-shrink: 0; background: var(--badge-bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); overflow: hidden; transition: border-color 0.3s; }
        .pokemon-img:hover { border-color: #7c3aed; }
        .pokemon-img img { width: 85%; height: 85%; object-fit: contain; }

        /* ── MEMBER NAME ── */
        .member-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.7rem; color: #c2185b; }
        .creator-name { color: #0ea5e9 !important; text-shadow: 0 0 8px rgba(14,165,233,0.6); animation: creatorNameGlow 2s ease-in-out infinite; }
        @keyframes creatorNameGlow { 0%,100% { text-shadow: 0 0 8px rgba(14,165,233,0.6); } 50% { text-shadow: 0 0 14px rgba(14,165,233,0.9), 0 0 24px rgba(14,165,233,0.4); } }
        body.theme-light .creator-name, body.theme-medium .creator-name { color: #1e3a5f !important; text-shadow: 0 0 8px rgba(30,58,95,0.4); animation: creatorNameGlowLight 2s ease-in-out infinite; }
        @keyframes creatorNameGlowLight { 0%,100% { text-shadow: 0 0 8px rgba(30,58,95,0.4); color: #1e3a5f; } 50% { text-shadow: 0 0 14px rgba(30,58,95,0.7); color: #2a4a7f; } }

        /* ── SECTIONS ── */
        .section { margin-bottom: 0.8rem; }
        .section-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; color: var(--section-title); margin-bottom: 0.5rem; text-transform: uppercase; }
        .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .badge { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.78rem; background: var(--badge-bg); border: 1px solid var(--border); color: var(--text); }
        .badge.artist { color: var(--text-muted); }

        /* ── REACTIONS ── */
        .reaction-bar { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--divider); }
        .react-btn { display: flex; align-items: center; gap: 0.3rem; padding: 0.28rem 0.65rem; border-radius: 20px; border: 1.5px solid var(--border); background: var(--react-bg); cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--text); transition: all 0.2s; user-select: none; font-family: 'Inter', sans-serif; }
        .react-btn:hover { border-color: #7c3aed; transform: scale(1.08); }
        .react-btn.reacted { background: rgba(124,58,237,0.2); border-color: #7c3aed; }
        .react-btn .emoji { font-size: 0.95rem; }
        .react-btn .count { font-size: 0.78rem; min-width: 10px; }

        /* ── FOOTER ── */
        .footer { text-align: center; padding: 2rem 1rem; margin-top: 2rem; font-size: 0.8rem; color: rgba(125,107,176,0.3); letter-spacing: 1px; border-top: 1px solid transparent; }
        .footer span { color: #0ea5e9; font-weight: 600; text-shadow: 0 0 8px rgba(14,165,233,0.5); animation: creatorNameGlow 2s ease-in-out infinite; }
        body.theme-light .footer span, body.theme-medium .footer span { color: #1e3a5f !important; text-shadow: 0 0 8px rgba(30,58,95,0.4); animation: creatorNameGlowLight 2s ease-in-out infinite; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .grid { grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); padding: 0 1rem 4rem; }
            .theme-switcher { top: 0.6rem; right: 0.6rem; }
        }
    </style>
</head>
<body class="theme-light">

<div class="theme-switcher">
    <div class="theme-btn t-light active" title="Light" onclick="setTheme('light')"></div>
    <div class="theme-btn t-medium" title="Medium" onclick="setTheme('medium')"></div>
    <div class="theme-btn t-dark" title="Dark" onclick="setTheme('dark')"></div>
    <div class="theme-btn t-darker" title="Darker" onclick="setTheme('darker')"></div>
    <div class="theme-btn t-neon" title="Neon" onclick="setTheme('neon')"></div>
</div>

<div class="header">
    <h1><span class="poke">POKENEEDLE</span> <span class="needle">COMMUNITY</span></h1>
    <div class="header-line"></div>
    <p class="subtitle">Pokémon Favorites Showcase</p>
</div>

<!-- Browser-style tabs -->
<div class="browser-tabs">
    <button class="browser-tab active" id="tab-pokemon" onclick="switchTab('pokemon')">⭐ Fav Pokémon</button>
    <button class="browser-tab" id="tab-birthdays" onclick="switchTab('birthdays')">🎂 Birthdays</button>
    <button class="browser-tab" id="tab-mods" onclick="switchTab('mods')">🛡️ Mods</button>
</div>

<!-- Pokémon Tab -->
<div id="view-pokemon">
    <div class="search-wrap">
        <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search by name, Pokémon, or artist...">
        </div>
    </div>
    <div class="grid" id="grid">
        <div style="text-align:center;padding:3rem;grid-column:1/-1;color:var(--text-muted);">Loading...</div>
    </div>
</div>

<!-- Birthday Tab -->
<div id="view-birthdays" style="display:none;">
    <div class="birthday-list" id="birthday-list"></div>
</div>

<!-- Mods Tab -->
<div id="view-mods" style="display:none;">

    let birthdays = [];

    async function fetchBirthdays() {
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Birthdays`;
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));

            if (!json.table?.rows) return;

            const months = {
                'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,
                'july':7,'august':8,'september':9,'october':10,'november':11,'december':12
            };

            birthdays = [];
            json.table.rows.forEach((row, i) => {
                if (i === 0) return; // skip header
                const name   = row.c[0]?.v || '';
                const month  = row.c[1]?.v || '';
                const day    = row.c[2]?.v || row.c[2]?.f || '';

                if (name && month && day) {
                    const monthNum = months[month.toLowerCase().trim()];
                    const dayNum = parseInt(day);
                    if (monthNum && dayNum) {
                        birthdays.push({ name: name.trim(), month: monthNum, day: dayNum });
                    }
                }
            });

            console.log(`Loaded ${birthdays.length} birthdays from sheet`);
        } catch(e) {
            console.log('Could not load birthdays from sheet:', e);
        }
    }

    // ── POKEMON TYPE COLORS ───────────────────────────────────────────
    const typeColors = {

    async function fetchPokemonTypeColor(name) {
        if (pokemonTypeCache[name]) return pokemonTypeCache[name];
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
            const d = await res.json();
            const color = typeColors[d.types[0]?.type?.name] || '#9933cc';
            pokemonTypeCache[name] = color;
            return color;
        } catch(e) { pokemonTypeCache[name] = '#9933cc'; return '#9933cc'; }
    }

    function getPokemonBadgeColor(name) {
        const { base } = cleanPokemonName(name);
        if (pokemonTypeCache[base]) return pokemonTypeCache[base];
        const fallback = {
            'wooper':'#6890F0','mimikyu':'#705898','frigibax':'#6890F0','gothita':'#705898',
            'greavard':'#705848','joltik':'#F8D030','shroodle':'#A040A0','impadimp':'#A040A0',

            'amaura':'#98D8D8','chikorita':'#78C850','clefairy':'#EE99AC','oddish':'#78C850',
            'zapdos':'#F8D030','shuckle':'#C03028','pikachu':'#F8D030','ninetales':'#F08030',
            'ditto':'#A890F0','sprigatito':'#78C850','hoothoot':'#A8A878','trubbish':'#A040A0',
            'garbodor':'#A040A0','mankey':'#C03028','marill':'#6890F0','blitzle':'#F8D030',
            'milotic':'#6890F0','sylveon':'#EE99AC','giratina':'#705898','charizard':'#F08030',
            'rayquaza':'#7038F8','squirtle':'#6890F0','lapras':'#6890F0','eevee':'#A8A878',
            'leafeon':'#78C850','glaceon':'#98D8D8','espeon':'#F85888','vaporeon':'#6890F0',
            'togepi':'#EE99AC','lycanroc':'#B8A038','miltank':'#A8A878','cubone':'#E0C068',
            'tangela':'#78C850','mew':'#F85888',
        };
        return fallback[base] || '#9933cc';
    }

    function cleanPokemonName(raw) {
        const lower = raw.toLowerCase().trim();
        const isShiny = /shiny/i.test(lower);
        const isMegaX = /mega.*\bx\b/.test(lower);
        const isMegaY = /mega.*\by\b/.test(lower);
        const isMega  = /mega/.test(lower);
        const base = lower
            .replace(/shiny/gi,'').replace(/mega/gi,'')
            .replace(/\bx\b/gi,'').replace(/\by\b/gi,'')
            .replace(/altered/gi,'').replace(/origin/gi,'')
            .replace(/\s+/g,'-').replace(/[:'?!*&^%$#@()[\]{}<>|\\~`]/g,'')
            .replace(/-+/g,'-').replace(/^-|-$/g,'').split('-')[0];
        return { base, isShiny, isMega, isMegaX, isMegaY };
    }

    function getPokemonImageUrl(name, memberName = '') {
        if (/giratina.*origin|origin.*giratina/i.test(name))
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10007.png`;
        if (/giratina.*altered|altered.*giratina/i.test(name))
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/487.png`;

        const { base, isShiny, isMega, isMegaX, isMegaY } = cleanPokemonName(name);

        if (isMegaX) return `https://img.pokemondb.net/sprites/home/normal/${base}-mega-x.png`;
        if (isMegaY) return `https://img.pokemondb.net/sprites/home/normal/${base}-mega-y.png`;
        if (isMega && isShiny) return `https://img.pokemondb.net/sprites/home/shiny/${base}-mega.png`;
        if (isMega) return `https://img.pokemondb.net/sprites/home/normal/${base}-mega.png`;

        const id = pokemonIds[base];
        if (id) return isShiny
            ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/${id}.png`
            : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

        const cacheKey = (isShiny ? 'shiny_' : '') + base;
        if (imageCache[cacheKey] && imageCache[cacheKey] !== 'missing') return imageCache[cacheKey];
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/0.png`;
    }

    async function loadUnknownPokemonImages() {
        const imgs = document.querySelectorAll('.pokemon-img img');
        const promises = [];
        imgs.forEach(img => {
            if (!img.src.includes('/0.png') && img.dataset.loaded !== 'false') return;
            const rawName = img.alt;
            const isShiny = /shiny/i.test(rawName);
            const pokemonName = rawName.toLowerCase()
                .replace(/shiny/gi,'').replace(/\s+/g,'-')
                .replace(/[:'?!*&^%$#@()[\]{}<>|\\~`]/g,'')
                .replace(/-+/g,'-').replace(/^-|-$/g,'').split('-')[0];
            const cacheKey = (isShiny ? 'shiny_' : '') + pokemonName;
            if (!pokemonName || imageCache[cacheKey] === 'missing') { img.parentElement.style.display='none'; return; }
            if (imageCache[cacheKey]) { img.src = imageCache[cacheKey]; return; }
            const p = fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`)
                .then(r => r.json())
                .then(d => {
                    const url = isShiny
                        ? (d.sprites?.other?.['official-artwork']?.front_shiny || d.sprites?.other?.['official-artwork']?.front_default)
                        : d.sprites?.other?.['official-artwork']?.front_default;
                    if (url) { imageCache[cacheKey]=url; img.src=url;
                        const t = d.types[0]?.type?.name; if(t) pokemonTypeCache[pokemonName]=typeColors[t]||'#9933cc';
                    } else { imageCache[cacheKey]='missing'; img.parentElement.style.display='none'; }
                })
                .catch(() => { imageCache[cacheKey]='missing'; img.parentElement.style.display='none'; });
            promises.push(p);
        });
        await Promise.all(promises);
    }

    const carouselTimers = {};

    function initCarousels() {
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.closest('.react-btn')) return;
                const slug = this.dataset.slug;
                const track = document.getElementById(`track-${slug}`);
                if (!track) return;
                const isActive = this.classList.contains('active');
                if (activeCard && activeCard !== this) {
                    activeCard.classList.remove('active');
                    const prevTrack = document.getElementById(`track-${activeCard.dataset.slug}`);
                    if (prevTrack) { cancelAnimationFrame(carouselTimers[activeCard.dataset.slug]); prevTrack.style.transform='translateX(0)'; }
                }
                if (isActive) {
                    this.classList.remove('active');
                    cancelAnimationFrame(carouselTimers[slug]);
                    track.style.transform='translateX(0)';
                    activeCard=null;
                } else {
                    this.classList.add('active');
                    activeCard=this;
                    const items = track.querySelectorAll('.pokemon-img');
                    if (items.length <= 1) return;
                    if (!track.dataset.duped) { track.innerHTML += track.innerHTML; track.dataset.duped='1'; }
                    const itemWidth = 85+8;
                    const totalWidth = itemWidth * items.length;
                    let pos=0;
                    function scroll() { pos+=0.6; if(pos>=totalWidth) pos=0; track.style.transform=`translateX(-${pos}px)`; carouselTimers[slug]=requestAnimationFrame(scroll); }
                    carouselTimers[slug]=requestAnimationFrame(scroll);
                }
            });
        });
    }

    // ── FIREBASE REACTIONS ────────────────────────────────────────────
    const FB_URL = 'https://pokeneedle-e3307-default-rtdb.asia-southeast1.firebasedatabase.app/reactions';

    async function loadReactions() {
        try { const res=await fetch(`${FB_URL}.json`); reactions=await res.json()||{}; } catch(e) { reactions={}; }
    }

    async function saveReaction(memberName) {
        try {
            await fetch(`${FB_URL}/${encodeURIComponent(memberName)}.json`,{
                method:'PUT', headers:{'Content-Type':'application/json'},
                body:JSON.stringify(reactions[memberName])
            });
        } catch(e) {}
    }

    async function toggleReact(memberName, type) {
        const slug = memberName.replace(/\s+/g,'-');
        const myKey = 'pokeneedle_my_'+memberName+'_'+type;
        const already = localStorage.getItem(myKey);
        if (!reactions[memberName]) reactions[memberName]={heart:0,wow:0};
        if (already) { reactions[memberName][type]=Math.max(0,(reactions[memberName][type]||0)-1); localStorage.removeItem(myKey); }
        else { reactions[memberName][type]=(reactions[memberName][type]||0)+1; localStorage.setItem(myKey,'1'); }
        updateReactUI(memberName,slug);
        await saveReaction(memberName);
    }

    function updateReactUI(memberName, slug) {
        const counts = reactions[memberName]||{heart:0,wow:0};
        ['heart','wow'].forEach(type => {
            const btn=document.getElementById(`react-${type}-${slug}`);
            const count=document.getElementById(`count-${type}-${slug}`);
            if(!btn||!count) return;
            count.textContent=counts[type]||0;
            btn.classList.toggle('reacted',!!localStorage.getItem('pokeneedle_my_'+memberName+'_'+type));
        });
    }

    function loadAllReactUI() { data.forEach(m=>updateReactUI(m.name,m.name.replace(/\s+/g,'-'))); }

    // ── RENDER CARD ───────────────────────────────────────────────────
    function renderCard(m) {
        const pokemon = m.pokemon.split(/[,\/]/).map(p=>p.trim()).filter(p=>p);
        const artists = m.artists.split(',').map(a=>a.trim()).filter(a=>a).slice(0,4);
        const isCreator = m.name==='German';
        const slug = m.name.replace(/\s+/g,'-');
        const silhouetteUrl = pokemon[0] ? getPokemonImageUrl(pokemon[0],m.name) : '';
        return `
        <div class="card ${isCreator?'creator-card':''}" data-slug="${slug}">
            ${silhouetteUrl?`<img class="card-silhouette" src="${silhouetteUrl}" alt="">`:''}
            <div class="card-body">
            ${pokemon.length?`
            <div class="pokemon-images ${pokemon.length===1?'single':''}" id="carousel-${slug}">
                <div class="pokemon-track" id="track-${slug}">
                    ${pokemon.map(p=>`
                    <div class="pokemon-img" title="${p}">
                        <img src="${getPokemonImageUrl(p,m.name)}" alt="${p}" onerror="
                            const s=this.src;
                            if(s.includes('home/normal')){this.src=s.replace('home/normal','sword-shield/normal');}
                            else if(s.includes('home/shiny')){this.src=s.replace('home/shiny','sword-shield/normal');}
                            else{this.parentElement.style.display='none';
                            const c=this.closest('.pokemon-images');
                            if(c){const v=c.querySelectorAll('.pokemon-img:not([style*=none])');if(v.length===1)c.classList.add('auto-single');}}
                        ">
                    </div>`).join('')}
                </div>
            </div>`:''}
            <div class="member-name ${isCreator?'creator-name':''}">${m.name}</div>
            ${pokemon.length?`
            <div class="section">
                <div class="section-title">Favorite Pokémon</div>
                <div class="badges">${pokemon.map(p=>`<span class="badge" style="color:${getPokemonBadgeColor(p)};font-weight:600">${p}</span>`).join('')}</div>
            </div>`:''}
            ${artists.length?`
            <div class="section">
                <div class="section-title">Favorite Artists</div>
                <div class="badges">${artists.map(a=>`<span class="badge artist">${a}</span>`).join('')}</div>
            </div>`:''}
            </div>
            <div class="reaction-bar">
                <button class="react-btn" id="react-heart-${slug}" onclick="toggleReact('${m.name}','heart')">
                    <span class="emoji">❤️</span><span class="count" id="count-heart-${slug}">0</span>
                </button>
                <button class="react-btn" id="react-wow-${slug}" onclick="toggleReact('${m.name}','wow')">
                    <span class="emoji">🤩</span><span class="count" id="count-wow-${slug}">0</span>
                </button>
            </div>
        </div>`;
    }

    function renderCards(members) {
        const grid = document.getElementById('grid');
        if (!members.length) { grid.innerHTML=`<div style="text-align:center;padding:3rem;grid-column:1/-1;color:var(--text-muted);">No results found.</div>`; return; }
        grid.innerHTML = members.map(m=>renderCard(m)).join('');
    }

    // ── SHEET DATA ────────────────────────────────────────────────────
    async function fetchSheetData() {
        try {
            const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
            const res=await fetch(url);
            const text=await res.text();
            const json=JSON.parse(text.substring(text.indexOf('{'),text.lastIndexOf('}')+1));
            parseGoogleData(json);
            renderCards(data);
            initCarousels();
            loadReactions().then(()=>loadAllReactUI());
            loadUnknownPokemonImages();
        } catch(e) {
            document.getElementById('grid').innerHTML=`<div style="text-align:center;padding:3rem;grid-column:1/-1;color:var(--text-muted);">Error loading data. Please refresh.</div>`;
        }
    }

    function parseGoogleData(json) {
        data=[];
        if (!json.table?.rows) return;
        json.table.rows.forEach((row,i)=>{
            if (i===0) return;
            const name=row.c[0]?.v||'';
            const pokemon=row.c[1]?.v||'';
            const artists=row.c[2]?.v||'';
            if (name && name.toLowerCase()!=='who are u') data.push({name,pokemon,artists});
        });
    }

    // ── SEARCH ────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', e=>{
        const q=e.target.value.toLowerCase();
        const filtered=data.filter(m=>
            m.name.toLowerCase().includes(q)||
            m.pokemon.toLowerCase().includes(q)||
            m.artists.toLowerCase().includes(q)
        );
        renderCards(filtered);
        loadUnknownPokemonImages();
        initCarousels();
        loadAllReactUI();
    });

    // ── INIT ──────────────────────────────────────────────────────────
    loadPokemonIds().then(() => {
        fetchSheetData();
        fetchBirthdays();
        setInterval(fetchSheetData, 30000);
        setInterval(fetchBirthdays, 30000);
    });

    // ── SCROLL TO TOP ─────────────────────────────────────────────────
    window.addEventListener('scroll', () => {
        const btn = document.getElementById('scrollTop');
        if (window.scrollY > 300) {
            btn.classList.add('visible');
        } else {
            btn.classList.remove('visible');
        }
    });

    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('keydown',e=>{
        if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','C','J'].includes(e.key))) e.preventDefault();
    });
</script>
</body>
</html>
